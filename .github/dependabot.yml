# =============================================================================
# Dependabot — atualização contínua de dependências (gerado a partir de
# templates/github/dependabot.yml do repo de infra).
#
# Toda segunda abre PRs AGRUPADOS para a branch develop: passam pelo CI
# (lint + testes + build + scan) e seguem o fluxo normal develop → main.
# Correções de SEGURANÇA (Dependabot security updates, ligado por
# `make github`) vão direto para a main, também validadas pelo check `ci`.
# =============================================================================
version: 2
updates:
  - package-ecosystem: npm
    directory: "/products"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      products-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/products"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
